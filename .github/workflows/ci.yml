name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all JS files
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 node --check

      - name: Run tests (if defined)
        run: |
          if npm run | grep -q " test$"; then
            npm test
          else
            echo "No test script defined in package.json — skipping."
          fi

      - name: Smoke test — server boots and responds
        run: |
          npm start &
          SERVER_PID=$!
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000/api/tasks > /dev/null; then
              echo "Server responded successfully."
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "Server did not respond in time."
          kill $SERVER_PID
          exit 1

  deploy:
    name: Deploy to EC2
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ${{ secrets.EC2_APP_PATH }}
            git fetch origin main
            git reset --hard origin/main
            npm ci --omit=dev
            pm2 restart task-manager || pm2 start server.js --name task-manager
            pm2 save
            